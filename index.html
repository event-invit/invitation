<style>
  :root{
    --bg:#f6f1e9; --paper:#fffdf9; --ink:#2e2a25; --sub:#7a7066; --line:#e4dbcf;
    --accent:#a65d3f; --accent-soft:#f0e2d8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:#e9e3da;color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.08)}
  section{padding:72px 28px;text-align:center}
  .serif{font-family:'Gowun Batang',serif}
  .eyebrow{font-size:11px;letter-spacing:.35em;color:var(--accent);margin-bottom:10px;text-transform:uppercase;font-weight:500}
  h2{font-family:'Gowun Batang',serif;font-size:22px;font-weight:700;margin-bottom:28px;letter-spacing:-.01em}
  .divider{width:1px;height:40px;background:var(--line);margin:0 auto}

  /* 스크롤 시 나타나는 효과 */
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
  .reveal.on{opacity:1;transform:none}

  /* 1. 커버 */
  .cover{padding:0;position:relative}
  .cover-img{width:100%;aspect-ratio:3/4;object-fit:cover}
  .cover-text{padding:40px 28px 56px;background:var(--paper)}
  .cover-text .date{font-size:13px;letter-spacing:.25em;color:var(--sub)}
  .cover-text h1{font-family:'Gowun Batang',serif;font-size:30px;line-height:1.35;margin:14px 0 18px;font-weight:700}
  .cover-text .place{font-size:14px;color:var(--sub)}
  .scroll-cue{margin-top:28px;font-size:11px;letter-spacing:.3em;color:var(--sub);animation:float 2s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(6px)}}

  /* 2. 인사말 */
  .greeting p{font-family:'Gowun Batang',serif;font-size:15.5px;line-height:2.1;white-space:pre-line}
  .host{margin-top:32px;font-size:14px;color:var(--sub)}
  .host b{color:var(--ink);font-weight:500}

  /* 3. 일시 */
  .when{background:var(--paper)}
  .when .big{font-family:'Gowun Batang',serif;font-size:20px;margin-bottom:4px}
  .when .small{font-size:13px;color:var(--sub);margin-bottom:28px}
  .cal{max-width:300px;margin:0 auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;font-size:13px}
  .cal-grid .dow{font-size:11px;color:var(--sub);padding-bottom:6px}
  .cal-grid .sun{color:#c0574a}
  .cal-grid span{height:34px;display:flex;align-items:center;justify-content:center}
  .cal-grid .day-on{background:var(--accent);color:#fff;border-radius:50%;width:34px;margin:0 auto;font-weight:500}
  .dday{margin-top:28px;display:flex;justify-content:center;gap:10px}
  .dday div{background:var(--bg);border-radius:10px;width:58px;padding:10px 0}
  .dday b{display:block;font-family:'Gowun Batang',serif;font-size:22px;font-weight:700}
  .dday small{font-size:10px;color:var(--sub);letter-spacing:.1em}
  .dday-msg{margin-top:16px;font-size:14px}
  .dday-msg em{font-style:normal;color:var(--accent);font-weight:500}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;border:1px solid var(--line);border-radius:22px;background:var(--paper);font-size:13.5px;font-weight:400}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}

  /* 4. 프로그램 */
  .program ol{list-style:none;text-align:left;max-width:340px;margin:0 auto;border-left:1px solid var(--line);padding-left:22px}
  .program li{position:relative;padding-bottom:22px}
  .program li::before{content:"";position:absolute;left:-27px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .program time{font-size:12px;color:var(--accent);font-weight:500;letter-spacing:.05em}
  .program strong{display:block;font-weight:500;font-size:15px}
  .program span{font-size:13px;color:var(--sub)}

  /* 5. 갤러리 */
  .gallery{background:var(--paper)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .grid button{aspect-ratio:1;overflow:hidden}
  .grid img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
  .grid button:active img{transform:scale(1.05)}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;align-items:center;justify-content:center;touch-action:pan-y}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:86vh;object-fit:contain}
  .lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;color:#fff;font-size:30px;width:44px;height:44px}
  .lb-count{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));color:#fff;font-size:13px;letter-spacing:.2em;opacity:.8}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:34px;width:48px;height:64px;opacity:.7}
  .lb-prev{left:4px}.lb-next{right:4px}

  /* 6. 오시는 길 */
  .map{width:100%;height:240px;border:0;border-radius:12px;background:var(--line);margin-bottom:18px}
  .venue{font-family:'Gowun Batang',serif;font-size:18px;margin-bottom:4px}
  .addr{font-size:13.5px;color:var(--sub)}
  .copy-addr{font-size:12px;color:var(--accent);text-decoration:underline;margin-top:4px}
  .nav-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
  .nav-btns a{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
  .nav-btns i{width:16px;height:16px;border-radius:4px;display:inline-block}
  .transport{text-align:left;margin-top:30px;border-top:1px solid var(--line)}
  .transport div{padding:16px 0;border-bottom:1px solid var(--line)}
  .transport b{display:block;font-size:13px;font-weight:500;color:var(--accent);margin-bottom:4px}
  .transport p{font-size:13.5px;white-space:pre-line}

  /* 7. 참석 회신 */
  .rsvp{background:var(--paper)}
  .rsvp p{font-size:14px;color:var(--sub);margin-bottom:24px}
  .sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(30,25,20,.45);align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheet-body{background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:28px 24px calc(24px + env(safe-area-inset-bottom));text-align:left;animation:up .3s ease;max-height:92vh;overflow:auto}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet h3{font-family:'Gowun Batang',serif;font-size:19px;text-align:center;margin-bottom:22px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px}
  .field input,.field textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .field textarea{min-height:76px;resize:none}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;margin:0}
  .seg input{display:none}
  .seg span{display:block;text-align:center;padding:12px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--ink);background:#fff}
  .seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;width:150px}
  .stepper button{width:44px;height:46px;font-size:20px;color:var(--accent)}
  .stepper output{flex:1;text-align:center;font-size:16px}
  .sheet .actions{display:flex;gap:8px;margin-top:22px}
  .sheet .actions .btn{flex:1}

  /* 8. 문의 / 공유 */
  .contact-list{max-width:320px;margin:0 auto;text-align:left}
  .contact-list div{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
  .contact-list small{display:block;font-size:12px;color:var(--sub)}
  .contact-list a{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  footer{padding:48px 28px 64px;text-align:center;font-size:11px;color:var(--sub);letter-spacing:.1em}

  /* 배경음악 버튼 */
  .bgm{position:fixed;top:calc(14px + env(safe-area-inset-top));right:max(14px, calc(50vw - 240px + 14px));z-index:30;width:40px;height:40px;border-radius:50%;background:rgba(255,253,249,.85);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.12);display:none;align-items:center;justify-content:center}
  .bgm.show{display:flex}
  .bgm.playing svg{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(40,35,30,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:60;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}*{animation:none!important}}
</style>
</head>
<body>

<script>
(() => {
  const C = CONFIG, $ = id => document.getElementById(id);
  const [Y, M, D] = C.date.split('-').map(Number);
  const [hh, mm] = C.startTime.split(':').map(Number);
  const event = new Date(`${C.date}T${C.startTime}:00+09:00`);
  const DOW = ['일','월','화','수','목','금','토'];
  const dow = DOW[new Date(Y, M-1, D).getDay()];
  const ampm = hh < 12 ? '오전' : '오후', h12 = hh % 12 || 12;
  const timeKo = `${ampm} ${h12}시${mm ? ' ' + mm + '분' : ''}`;

  const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800); };
  const copy = async (text, msg) => {
    try { await navigator.clipboard.writeText(text); }
    catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast(msg);
  };

  /* 커버 · 인사말 */
  document.title = C.title;
  $('coverImg').src = C.coverImage;
  $('coverDate').textContent = `${Y}. ${String(M).padStart(2,'0')}. ${String(D).padStart(2,'0')}. ${['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(Y,M-1,D).getDay()]}`;
  $('coverTitle').textContent = C.titleBreak || C.title;
  $('coverPlace').textContent = `${M}월 ${D}일 ${dow}요일 ${timeKo} · ${C.venue}`;
  $('greeting').textContent = C.greeting;
  $('host').innerHTML = C.host ? `<b>${C.host}</b> 드림` : '';

  /* 일시 · 달력 */
  $('whenBig').textContent = `${Y}년 ${M}월 ${D}일 ${dow}요일`;
  $('whenSmall').textContent = `${timeKo} · ${C.venue}`;
  const cal = $('cal');
  DOW.forEach((d,i) => cal.insertAdjacentHTML('beforeend', `<span class="dow ${i===0?'sun':''}">${d}</span>`));
  const first = new Date(Y, M-1, 1).getDay(), last = new Date(Y, M, 0).getDate();
  for (let i = 0; i < first; i++) cal.insertAdjacentHTML('beforeend', '<span></span>');
  for (let d = 1; d <= last; d++) {
    const sun = (first + d - 1) % 7 === 0;
    cal.insertAdjacentHTML('beforeend', `<span class="${d===D?'day-on':''} ${sun&&d!==D?'sun':''}">${d}</span>`);
  }
  function tick(){
    const diff = event - new Date();
    if (diff <= 0) { $('dday').innerHTML = ''; $('ddayMsg').innerHTML = '행사가 <em>진행되었습니다</em>. 함께해 주셔서 감사합니다.'; return; }
    const s = Math.floor(diff/1000), parts = [[Math.floor(s/86400),'DAYS'],[Math.floor(s%86400/3600),'HOUR'],[Math.floor(s%3600/60),'MIN'],[s%60,'SEC']];
    $('dday').innerHTML = parts.map(([v,l]) => `<div><b>${v}</b><small>${l}</small></div>`).join('');
    $('ddayMsg').innerHTML = `행사가 <em>${Math.ceil(diff/86400000)}일</em> 남았습니다`;
  }
  tick(); setInterval(tick, 1000);

  /* 캘린더 저장 (아이폰·안드로이드 모두 지원하는 .ics 파일) */
  $('addCal').onclick = () => {
    const f = (d, t) => d.replace(/-/g,'') + 'T' + t.replace(':','') + '00';
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//invitation//KO','BEGIN:VEVENT',
      `UID:${Date.now()}@invitation`,`DTSTART;TZID=Asia/Seoul:${f(C.date,C.startTime)}`,`DTEND;TZID=Asia/Seoul:${f(C.date,C.endTime)}`,
      `SUMMARY:${C.title}`,`LOCATION:${C.venue} (${C.address})`,`DESCRIPTION:${location.href}`,
      'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY',`DESCRIPTION:${C.title}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
    a.download = 'event.ics'; a.click();
  };

  /* 프로그램 */
  $('program').innerHTML = C.program.map(p => `<li><time>${p.time}</time><strong>${p.title}</strong>${p.desc?`<span>${p.desc}</span>`:''}</li>`).join('');
  if (!C.program.length) document.querySelector('.program').remove();

  /* 갤러리 + 확대 보기 */
  const G = C.gallery; let gi = 0;
  $('grid').innerHTML = G.map((src,i) => `<button data-i="${i}" aria-label="사진 ${i+1} 크게 보기"><img src="${src}" loading="lazy" alt=""></button>`).join('');
  if (!G.length) document.querySelector('.gallery').remove();
  const showLb = i => { gi = (i + G.length) % G.length; $('lbImg').src = G[gi]; $('lbCount').textContent = `${gi+1} / ${G.length}`; };
  $('grid').onclick = e => { const b = e.target.closest('button'); if (!b) return; showLb(+b.dataset.i); $('lb').classList.add('open'); document.body.style.overflow='hidden'; };
  const closeLb = () => { $('lb').classList.remove('open'); document.body.style.overflow=''; };
  $('lbClose').onclick = closeLb; $('lbPrev').onclick = () => showLb(gi-1); $('lbNext').onclick = () => showLb(gi+1);
  $('lb').onclick = e => { if (e.target.id === 'lb') closeLb(); };
  let sx = 0;
  $('lb').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  $('lb').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) showLb(gi + (dx < 0 ? 1 : -1)); });

  /* 오시는 길 */
  const q = encodeURIComponent(C.venue), qa = encodeURIComponent(C.address);
  $('map').src = C.lat ? `https://maps.google.com/maps?q=${C.lat},${C.lng}&z=16&output=embed` : `https://maps.google.com/maps?q=${qa}&z=16&output=embed`;
  $('venue').textContent = C.venue; $('addr').textContent = C.address;
  $('copyAddr').onclick = () => copy(C.address, '주소가 복사되었습니다');
  $('navNaver').href = `https://map.naver.com/p/search/${q}`;
  $('navKakao').href = C.lat ? `https://map.kakao.com/link/to/${q},${C.lat},${C.lng}` : `https://map.kakao.com/link/search/${q}`;
  $('navTmap').onclick = e => {
    e.preventDefault();
    if (!C.lat) return toast('티맵 연결은 좌표가 필요합니다');
    location.href = `tmap://route?goalname=${q}&goalx=${C.lng}&goaly=${C.lat}`;
    setTimeout(() => { if (!document.hidden) toast('티맵 앱이 설치되어 있어야 합니다'); }, 1500);
  };
  $('transport').innerHTML = C.transport.map(t => `<div><b>${t.label}</b><p>${t.text}</p></div>`).join('');

  /* 참석 회신 */
  $('rsvpText').innerHTML = `원활한 행사 준비를 위해<br>${C.rsvpDeadline ? `<b style="color:var(--ink);font-weight:500">${C.rsvpDeadline}</b>까지 ` : ''}참석 여부를 알려주세요.`;
  let count = 1;
  $('minus').onclick = () => $('count').value = count = Math.max(1, count-1);
  $('plus').onclick = () => $('count').value = count = Math.min(20, count+1);
  document.querySelectorAll('input[name=attend]').forEach(r => r.onchange = () => $('countField').style.display = r.value === '불참' && r.checked ? 'none' : '');
  const openSheet = () => { $('sheet').classList.add('open'); document.body.style.overflow='hidden'; };
  const closeSheet = () => { $('sheet').classList.remove('open'); document.body.style.overflow=''; };
  $('openRsvp').onclick = openSheet; $('closeRsvp').onclick = closeSheet;
  $('sheet').onclick = e => { if (e.target.id === 'sheet') closeSheet(); };
  $('rsvpForm').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const attend = fd.get('attend');
    fd.set('count', attend === '참석' ? count : 0);
    const btn = $('submitRsvp'); btn.disabled = true; btn.textContent = '보내는 중…';
    try {
      if (C.rsvpUrl) await fetch(C.rsvpUrl, { method:'POST', mode:'no-cors', body:new URLSearchParams(fd) });
      else await new Promise(r => setTimeout(r, 600));   // 시험 모드
      closeSheet(); e.target.reset(); $('count').value = count = 1; $('countField').style.display='';
      toast(C.rsvpUrl ? '전달되었습니다. 감사합니다!' : '[시험 모드] 주소 연결 후 실제로 저장됩니다');
    } catch { toast('전송에 실패했습니다. 잠시 후 다시 시도해 주세요'); }
    btn.disabled = false; btn.textContent = '보내기';
  };

  /* 문의 */
  $('contacts').innerHTML = C.contacts.map(c => `<div><span><small>${c.role}</small>${c.name}</span><a href="tel:${c.tel.replace(/-/g,'')}" aria-label="${c.name}에게 전화"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a65d3f" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a></div>`).join('');
  if (!C.contacts.length) document.querySelector('.contact .contact-list').remove();

  /* 공유 */
  $('copyLink').onclick = () => copy(location.href, '링크가 복사되었습니다');
  let kakaoReady = false;
  if (C.kakaoKey) {
    const s = document.createElement('script');
    s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
    s.onload = () => { Kakao.init(C.kakaoKey); kakaoReady = true; };
    document.head.appendChild(s);
  }
  $('shareKakao').onclick = async () => {
    if (kakaoReady) {
      const img = document.querySelector('meta[property="og:image"]').content;
      return Kakao.Share.sendDefault({ objectType:'feed',
        content:{ title:C.title, description:`${M}월 ${D}일(${dow}) ${timeKo} · ${C.venue}`, imageUrl:img, link:{ mobileWebUrl:location.href, webUrl:location.href } },
        buttons:[{ title:'초대장 보기', link:{ mobileWebUrl:location.href, webUrl:location.href } }] });
    }
    if (navigator.share) { try { await navigator.share({ title:C.title, url:location.href }); } catch {} return; }
    copy(location.href, '링크가 복사되었습니다. 카톡에 붙여넣어 주세요');
  };
  $('footer').textContent = `${C.title}`;

  /* 배경음악: 브라우저 정책상 자동재생이 막혀서, 첫 터치 때 재생 시작 */
  if (C.bgm) {
    const audio = $('bgm'), btn = $('bgmBtn'), slash = $('bgmSlash');
    audio.src = C.bgm; audio.volume = 0.5;
    audio.addEventListener('error', () => btn.classList.remove('show'));
    btn.classList.add('show');
    const set = on => { btn.classList.toggle('playing', on); slash.style.display = on ? 'none' : ''; };
    set(false);
    let userMuted = false;
    btn.onclick = e => { e.stopPropagation(); if (audio.paused) { audio.play().then(() => set(true)).catch(()=>{}); userMuted = false; } else { audio.pause(); set(false); userMuted = true; } };
    const kick = e => { if (e.target.closest && e.target.closest('#bgmBtn')) return; if (!userMuted && audio.paused) audio.play().then(() => set(true)).catch(()=>{}); };
    ['touchstart','click'].forEach(ev => document.addEventListener(ev, kick, { once:true, passive:true }));
    document.addEventListener('visibilitychange', () => { if (document.hidden) audio.pause(); else if (btn.classList.contains('playing')) audio.play().catch(()=>{}); });
  }

  /* 스크롤 등장 효과 */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } }), { threshold:.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
})();
</script>
</body>
</html>
